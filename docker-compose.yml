services:
  postgres:
    image: postgres:13
    container_name: eino-work-postgres
    environment:
      POSTGRES_USER: eino
      POSTGRES_PASSWORD: eino
      POSTGRES_DB: eino_work
    ports:
      - "14432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eino -d eino_work"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
