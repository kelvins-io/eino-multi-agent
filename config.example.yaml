server:
  addr: ":8180"
  mode: debug
  # debug|info|warn|error
  log_level: info
  # console|json（release 模式默认 json）
  log_format: console
  # 非空则按天写入 <文件名>-YYYY-MM-DD.log（仍会输出到 stdout）
  log_file: ""
  # 保留天数，超过则删除；0 表示不清理
  log_keep_days: 14
  cors_origins:
    - "http://localhost:5273"
    - "http://127.0.0.1:5273"
    # Tauri 2 desktop shell origins
    - "http://tauri.localhost"
    - "https://tauri.localhost"
    - "tauri://localhost"
  # JWT 签名密钥（生产环境务必更换）
  jwt_secret: "eino-dev-jwt-secret-change-me"
  # Token 有效期
  jwt_expire: 168h
  # 可选：额外静态 Bearer，便于 CLI/脚本（与 JWT 并存）
  auth_token: ""

database:
  dsn: "postgres://eino:eino@127.0.0.1:14432/eino_work?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5

workspace:
  root: "./workspace"

skills:
  dir: "./skills"

llm:
  # openai | ark | ollama
  provider: "openai"
  api_key: ""
  base_url: ""
  model: "gpt-4o"
  # 主模型额度耗尽（如豆包安全体验模式 429）时按顺序切换
  fallback_models: []
  # 单次 ChatModel 调用超时。推理模型建议 10m，过短会在读响应体时 deadline exceeded
  timeout: 10m

agent:
  max_iteration: 40
  run_timeout: 30m
  language: "zh"

search:
  enabled: true
  max_results: 8

# A2A（Agent-to-Agent）。主 API 监听成功后自动拉起（auto_register），另开 Hertz 端口。
# 入站 message/send|stream 会创建本仓库 harness 任务；鉴权为静态 Bearer（EINO_A2A_AUTH_TOKEN）。
a2a:
  enabled: true
  auto_register: true
  addr: ":8181"
  public_url: "http://127.0.0.1:8181"
  handler_path: "/a2a"
  auth_token: ""
  name: "eino-work-harness"
  description: "长任务工作 Harness：下达目标、拆解执行、交付可下载产物"
  version: "1.0.0"
  # 入站任务默认确认策略；建议 never，避免 A2A 调用卡在 waiting_confirm
  confirm_policy: "never"
  # 启动成功后向注册中心 POST {"wellKnownURI":"<public_url>/.well-known/agent-card.json"}
  registries: []
  # - url: "https://a2aregistry.org/api/agents/register"
  #   auth_token: ""
  # 出站：挂到主控 SubAgents 的远程 A2A Agent
  remotes: []
  # - name: "remote-research"
  #   description: "远程调研代理"
  #   base_url: "http://127.0.0.1:9000"
  #   handler_path: "/a2a"
  #   auth_token: ""
  #   streaming: true

# MCP（Model Context Protocol）。主 API 启动后另开 Streamable HTTP；stdio 见 go run ./cmd/mcp。
# HTTP 端要求 Authorization: Bearer <JWT>（与 REST 同一用户隔离）。
mcp:
  enabled: true
  addr: ":8182"
  path: "/mcp"
  name: "eino-work-harness"
  version: "1.0.0"
