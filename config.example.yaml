server:
  addr: ":8180"
  mode: debug
  # debug|info|warn|error
  log_level: info
  # console|json（release 模式默认 json）
  log_format: console
  # 非空则按天写入 <文件名>-YYYY-MM-DD.log（仍会输出到 stdout）
  log_file: ""
  # 保留天数，超过则删除；0 表示不清理
  log_keep_days: 14
  cors_origins:
    - "http://localhost:5273"
    - "http://127.0.0.1:5273"
  # JWT 签名密钥（生产环境务必更换）
  jwt_secret: "eino-dev-jwt-secret-change-me"
  # Token 有效期
  jwt_expire: 168h
  # 可选：额外静态 Bearer，便于 CLI/脚本（与 JWT 并存）
  auth_token: ""

database:
  dsn: "postgres://eino:eino@127.0.0.1:14432/eino_work?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5

workspace:
  root: "./workspace"

skills:
  dir: "./skills"

llm:
  # openai | ark | ollama
  provider: "openai"
  api_key: ""
  base_url: ""
  model: "gpt-4o"
  # 主模型额度耗尽（如豆包安全体验模式 429）时按顺序切换
  fallback_models: []
  # 单次 ChatModel 调用超时。推理模型建议 10m，过短会在读响应体时 deadline exceeded
  timeout: 10m

agent:
  max_iteration: 40
  run_timeout: 30m
  language: "zh"

search:
  enabled: true
  max_results: 8
