[package]
name = "eino-multi-agent"
version = "0.1.0"
description = "Eino Multi Agent desktop shell"
authors = ["kelvins-io"]
edition = "2021"

[lib]
name = "eino_multi_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
